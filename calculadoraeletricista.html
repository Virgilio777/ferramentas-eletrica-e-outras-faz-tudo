<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de Bitola de Fio</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #111;
      margin: 0;
      padding: 16px;
      color: #fff;
    }
    .container {
      max-width: 520px;
      margin: 0 auto;
      background: #1a1a1a;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.5);
      overflow: hidden;
      border: 1px solid #333;
    }
    .header {
      background: #c62828;
      color: white;
      padding: 22px 20px;
      text-align: center;
    }
    .header h1 { margin: 0; font-size: 22px; }
    .header p { margin: 6px 0 0; opacity: 0.9; font-size: 13px; }
    .form { padding: 20px; }
    label {
      display: block;
      margin: 14px 0 6px;
      font-weight: 600;
      color: #eee;
      font-size: 14px;
    }
    input, select {
      width: 100%;
      padding: 14px;
      border: 1px solid #444;
      border-radius: 10px;
      font-size: 16px;
      background: #222;
      color: white;
    }
    input:focus, select:focus {
      outline: none;
      border-color: #c62828;
    }
    .buttons {
      display: flex;
      gap: 10px;
      margin-top: 22px;
    }
    button {
      flex: 1;
      padding: 15px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-calcular { background: #c62828; color: white; }
    .btn-calcular:hover { background: #b71c1c; }
    .btn-limpar { background: #333; color: #eee; }
    .resultado {
      margin: 0 20px 20px;
      padding: 18px;
      background: #222;
      border-radius: 12px;
      border-left: 5px solid #c62828;
      display: none;
    }
    .resultado h2 { margin: 0 0 12px; color: #ff5252; font-size: 18px; }
    .resultado p { margin: 8px 0; color: #ddd; }
    .aviso {
      margin-top: 14px;
      padding: 12px;
      background: #2c1a1a;
      border-radius: 8px;
      font-size: 13px;
      color: #ff8a80;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Calculadora de Bitola</h1>
      <p>Ferramenta prática para faz-tudo</p>
    </div>

    <div class="form">
      <label>Potência do aparelho (W)</label>
      <input type="number" id="potencia" placeholder="Ex: 7500" min="100">

      <label>Tensão</label>
      <select id="tensao">
        <option value="127">127 V</option>
        <option value="220">220 V</option>
      </select>

      <label>Distância total (ida + volta) em metros</label>
      <input type="number" id="distancia" placeholder="Ex: 20" min="1" step="0.5">

      <label>Tipo de instalação</label>
      <select id="instalacao">
        <option value="embutido">Embutido (alvenaria / eletroduto)</option>
        <option value="aparente">Aparente</option>
      </select>

      <div class="buttons">
        <button class="btn-calcular" onclick="calcular()">Calcular</button>
        <button class="btn-limpar" onclick="limpar()">Limpar</button>
      </div>
    </div>

    <div class="resultado" id="resultado">
      <h2>Resultado</h2>
      <p><strong>Corrente:</strong> <span id="corrente"></span> A</p>
      <p><strong>Bitola recomendada:</strong> <span id="bitola"></span> mm²</p>
      <p><strong>Disjuntor sugerido:</strong> <span id="disjuntor"></span> A</p>
      <p><strong>Queda de tensão estimada:</strong> <span id="queda"></span>%</p>
      <div class="aviso">
        Estimativa prática. Confira sempre a NBR 5410 e as condições reais da instalação.
      </div>
    </div>
  </div>

  <script>
    function calcular() {
      const potencia = parseFloat(document.getElementById('potencia').value);
      const tensao = parseFloat(document.getElementById('tensao').value);
      const distancia = parseFloat(document.getElementById('distancia').value);

      if (!potencia || !distancia || potencia < 100 || distancia < 1) {
        alert("Preencha potência e distância corretamente.");
        return;
      }

      const corrente = potencia / tensao;

      const tabela = [
        { bitola: 1.5, max: 15, disj: 10 },
        { bitola: 2.5, max: 21, disj: 16 },
        { bitola: 4,   max: 28, disj: 20 },
        { bitola: 6,   max: 36, disj: 25 },
        { bitola: 10,  max: 50, disj: 32 },
        { bitola: 16,  max: 68, disj: 40 },
        { bitola: 25,  max: 89, disj: 50 }
      ];

      let escolha = tabela[tabela.length - 1];
      for (let item of tabela) {
        if (corrente <= item.max) {
          escolha = item;
          break;
        }
      }

      let bitolaFinal = escolha.bitola;

      if (distancia > 30 && bitolaFinal < 4) bitolaFinal = 4;
      if (distancia > 50 && bitolaFinal < 6) bitolaFinal = 6;
      if (distancia > 70 && bitolaFinal < 10) bitolaFinal = 10;
      if (distancia > 100 && bitolaFinal < 16) bitolaFinal = 16;

      const quedaV = corrente * resistencia * 2;
