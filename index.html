<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de Bitola de Fio</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f0f4f8;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 520px;
      margin: 0 auto;
      background: white;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      overflow: hidden;
    }
    .header {
      background: #1a73e8;
      color: white;
      padding: 24px 20px;
      text-align: center;
    }
    .header h1 { margin: 0; font-size: 22px; }
    .header p { margin: 8px 0 0; opacity: 0.9; font-size: 14px; }
    .form { padding: 24px; }
    label {
      display: block;
      margin: 16px 0 6px;
      font-weight: 600;
      color: #333;
      font-size: 14px;
    }
    input, select {
      width: 100%;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
      background: #fafafa;
    }
    input:focus, select:focus {
      outline: none;
      border-color: #1a73e8;
      background: white;
    }
    .buttons {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }
    button {
      flex: 1;
      padding: 15px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-calcular { background: #1a73e8; color: white; }
    .btn-calcular:hover { background: #1557b0; }
    .btn-limpar { background: #e0e0e0; color: #333; }
    .resultado {
      margin: 0 24px 24px;
      padding: 20px;
      background: #e8f5e9;
      border-radius: 12px;
      border-left: 5px solid #34a853;
      display: none;
    }
    .resultado h2 { margin: 0 0 12px; color: #1b5e20; font-size: 18px; }
    .resultado p { margin: 8px 0; }
    .aviso {
      margin-top: 16px;
      padding: 12px;
      background: #fff3e0;
      border-radius: 8px;
      font-size: 13px;
      color: #e65100;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Calculadora de Bitola</h1>
      <p>Ferramenta prática para faz-tudo e eletricistas</p>
    </div>

    <div class="form">
      <label>Potência do aparelho (W)</label>
      <input type="number" id="potencia" placeholder="Ex: 7500" min="100">

      <label>Tensão</label>
      <select id="tensao">
        <option value="127">127 V</option>
        <option value="220">220 V</option>
      </select>

      <label>Distância total (ida + volta) em metros</label>
      <input type="number" id="distancia" placeholder="Ex: 20" min="1" step="0.5">

      <label>Tipo de instalação</label>
      <select id="instalacao">
        <option value="embutido">Embutido (alvenaria / eletroduto)</option>
        <option value="aparente">Aparente (menos aquecimento)</option>
      </select>

      <div class="buttons">
        <button class="btn-calcular" onclick="calcular()">Calcular</button>
        <button class="btn-limpar" onclick="limpar()">Limpar</button>
      </div>
    </div>

    <div class="resultado" id="resultado">
      <h2>Resultado</h2>
      <p><strong>Corrente:</strong> <span id="corrente"></span> A</p>
      <p><strong>Bitola recomendada:</strong> <span id="bitola"></span> mm²</p>
      <p><strong>Disjuntor sugerido:</strong> <span id="disjuntor"></span> A</p>
      <p><strong>Queda de tensão estimada:</strong> <span id="queda"></span>%</p>
      <div class="aviso">
        Estimativa prática baseada em valores comuns. Sempre confira a NBR 5410 e considere as condições reais da instalação.
      </div>
    </div>
  </div>

  <script>
    function calcular() {
      const potencia = parseFloat(document.getElementById('potencia').value);
      const tensao = parseFloat(document.getElementById('tensao').value);
      const distancia = parseFloat(document.getElementById('distancia').value);
      const instalacao = document.getElementById('instalacao').value;

      if (!potencia || !distancia || potencia < 100 || distancia < 1) {
        alert("Preencha potência e distância corretamente.");
        return;
      }

      const corrente = potencia / tensao;

      // Tabela prática de bitola (corrente máxima aproximada)
      const tabela = [
        { bitola: 1.5, max: 15, disj: 10 },
        { bitola: 2.5, max: 21, disj: 16 },
        { bitola: 4,   max: 28, disj: 20 },
        { bitola: 6,   max: 36, disj: 25 },
        { bitola: 10,  max: 50, disj: 32 },
        { bitola: 16,  max: 68, disj: 40 },
        { bitola: 25,  max: 89, disj: 50 },
        { bitola: 35,  max: 110, disj: 63 }
      ];

      let escolha = tabela[tabela.length - 1];
      for (let item of tabela) {
        if (corrente <= item.max) {
          escolha = item;
          break;
        }
      }

      // Ajuste por distância (queda de tensão)
      let fatorDist = 1;
      if (distancia > 30) fatorDist = 1.2;
      if (distancia > 50) fatorDist = 1.4;
      if (distancia > 80) fatorDist = 1.6;

      let bitolaFinal = escolha.bitola;
      if (fatorDist > 1.1 && bitolaFinal < 6) bitolaFinal = 6;
      if (fatorDist > 1.3 && bitolaFinal < 10) bitolaFinal = 10;
      if (fatorDist > 1.5 && bitolaFinal < 16) bitolaFinal = 16;

      // Queda de tensão aproximada (simplificada)
      const resistencia = (distancia * 0.0175) / (bitolaFinal * 2); // cobre
      const quedaV = (corrente * resistencia * 2);
      const quedaPercent = (quedaV / tensao) * 100;

      document.getElementById('corrente').textContent = corrente.toFixed(1);
      document.getElementById('bitola').textContent = bitolaFinal;
      document.getElementById('disjuntor').textContent = escolha.disj;
      document.getElementById('queda').textContent = quedaPercent.toFixed(1);
      document.getElementById('resultado').style.display = 'block';
    }

    function limpar() {
      document.getElementById('potencia').value = '';
      document.getElementById('distancia').value = '';
      document.getElementById('resultado').style.display = 'none';
    }
  </script>
</body>
</html>
