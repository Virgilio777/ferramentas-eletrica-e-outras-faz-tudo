<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acesso às Ferramentas - Ferramentas Elétrica</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #111;
      margin: 0;
      padding: 20px;
      color: #fff;
    }
    .container { max-width: 520px; margin: 0 auto; }
    .header {
      background: #c62828;
      padding: 28px 20px;
      border-radius: 16px;
      text-align: center;
      margin-bottom: 24px;
    }
    .header h1 { margin: 0; font-size: 24px; }
    .header p { margin: 8px 0 0; opacity: 0.9; }
    .card {
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 24px;
    }
    label { display: block; font-weight: 600; margin-bottom: 8px; }
    input[type="text"] {
      width: 100%;
      padding: 14px;
      font-size: 18px;
      border-radius: 8px;
      border: 1px solid #444;
      background: #222;
      color: #fff;
      margin-bottom: 16px;
    }
    input[type="text"]:focus { outline: none; border-color: #c62828; }
    button {
      width: 100%;
      padding: 16px;
      font-size: 18px;
      font-weight: 600;
      background: #c62828;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    button:hover { background: #b71c1c; }
    .mensagem {
      margin-top: 16px;
      padding: 12px;
      border-radius: 8px;
      text-align: center;
      display: none;
    }
    .erro { background: #3d1212; color: #ff8a80; border: 1px solid #c62828; }
    .info { margin-top: 20px; font-size: 14px; color: #aaa; text-align: center; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Acesso às Ferramentas</h1>
      <p>Digite o código que veio no livro</p>
    </div>
    <div class="card">
      <form id="formAcesso">
        <label for="codigo">Código de acesso</label>
        <input type="text" id="codigo" placeholder="Ex: ELETRICA2026" autocomplete="off" required>
        <button type="submit">Liberar acesso</button>
      </form>
      <div id="mensagem" class="mensagem erro"></div>
      <div class="info">O código está no livro. Verifique com atenção (letras maiúsculas).</div>
    </div>
  </div>

  <script>
    const CODIGO_VALIDO = "ELETRICA2026";
    document.getElementById("formAcesso").addEventListener("submit", function(e) {
      e.preventDefault();
      const codigoDigitado = document.getElementById("codigo").value.trim().toUpperCase();
      const mensagem = document.getElementById("mensagem");
      if (codigoDigitado === CODIGO_VALIDO) {
        window.location.href = "ferramentas.html";
      } else {
        mensagem.textContent = "Código inválido. Verifique o código que veio no livro.";
        mensagem.style.display = "block";
      }
    });
  </script>
</body>
</html>
